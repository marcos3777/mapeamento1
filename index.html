<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Buscador CEP • GDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b0b0f; --card:#14141b; --text:#e7e7ef; --muted:#9aa0aa; --accent:#bada55;
      --border:#23232c;
    }
    body { background:var(--bg); color:var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius: 14px; padding:16px; margin: 0 0 16px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    input[type="text"] { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0f0f15; color:var(--text); width: 180px; }
    input[type="file"] { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0f0f15; color:var(--text); cursor: pointer; }
    input[type="file"]::file-selector-button { 
      padding:8px 12px; 
      border-radius:8px; 
      border:1px solid var(--border); 
      background:#111118; 
      color:var(--text); 
      cursor:pointer; 
      margin-right: 10px;
    }
    input[type="file"]::file-selector-button:hover { opacity: 0.9; }
    button { padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:#111118; color:var(--text); cursor:pointer; }
    button.primary { background: var(--accent); color:#111; font-weight: 600; }
    button:hover { opacity: 0.9; }
    .muted { color: var(--muted); font-size: 13px; }
    .pill { display:inline-block; padding:3px 8px; border:1px solid var(--border); border-radius:999px; background:#101018; margin-right:6px; font-size: 11px; }
    
    /* Lista de endereços */
    .address-list { max-height: 70vh; overflow-y: auto; }
    .address-item { 
      padding: 12px; 
      border-bottom: 1px solid var(--border); 
      cursor: pointer; 
      transition: background 0.2s;
    }
    .address-item:hover { background: #1a1a24; }
    .address-header { font-weight: 600; margin-bottom: 6px; color: var(--accent); }
    .indicators { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .indicator { font-size: 12px; }
    .indicator-label { color: var(--muted); }
    .indicator-values { display: flex; gap: 4px; flex-wrap: wrap; }
    .indicator-value { 
      display: inline-block; 
      padding: 2px 6px; 
      background: #0e0e14; 
      border-radius: 4px;
      font-size: 11px;
    }
    .indicator-value.warn { background: #4a3510; color: #ffc107; }
    
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close {
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .modal-close:hover { background: var(--border); }
    .modal-section {
      margin-bottom: 20px;
    }
    .modal-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .modal-field {
      background: #0e0e14;
      padding: 10px;
      border-radius: 8px;
    }
    .modal-field-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .modal-field-value {
      font-size: 14px;
      font-weight: 500;
    }
    .chart-container {
      background: #0e0e14;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .chart-bars {
      display: flex;
      align-items: flex-end;
      height: 120px;
      gap: 4px;
      margin-top: 8px;
    }
    .chart-bar {
      flex: 1;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      position: relative;
    }
    .chart-bar.warning { background: #ffc107; }
    .chart-label {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.active { background: #1a4d1a; color: #4caf50; }
    .status-badge.inactive { background: #4a1a1a; color: #f44336; }

    #globalLoader {
      position: fixed;
      inset: 0;
      background: rgba(11, 11, 15, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    #globalLoader.show {
      display: flex;
    }
    #globalLoader .loader {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="globalLoader" aria-hidden="true">
    <div class="loader" role="status" aria-label="Carregando"></div>
  </div>
  <h1>🔎 Buscador de CEP no GDB</h1>

  <div class="card">
    <h2 style="margin-top:0">Buscar por CEP (API)</h2>
    <div class="row">
      <input id="cep" type="text" placeholder="Digite o CEP (ex: 04826-240)" />
      <button id="btnBuscar" class="primary">Buscar</button>
      <button id="btnLimpar">Limpar</button>
      <span class="muted" id="status" aria-live="polite" aria-busy="false"></span>
    </div>
  </div>

    <div class="card">
    <h2 style="margin-top:0">Carregar arquivo GeoJSON</h2>
    <div class="row">
      <input type="file" id="fileInput" accept=".geojson,.json" style="width: auto;" />
      <button id="btnUploadFile" class="primary">Carregar Arquivo</button>
      <button id="btnDownload">Baixar JSON</button>
      <span class="muted" id="uploadStatus" aria-live="polite" aria-busy="false"></span>
    </div>
    </div>

    <div class="card">
    <h2 style="margin-top:0">Lista de Endereços</h2>
    <div class="muted" id="resumo"></div>
    <div id="addressList" class="address-list"></div>
  </div>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    const $cep = document.getElementById('cep');
    const $btnBuscar = document.getElementById('btnBuscar');
    const $btnLimpar = document.getElementById('btnLimpar');
    const $status = document.getElementById('status');
    const $addressList = document.getElementById('addressList');
    const $resumo = document.getElementById('resumo');
    const $btnDownload = document.getElementById('btnDownload');
    const $fileInput = document.getElementById('fileInput');
    const $btnUploadFile = document.getElementById('btnUploadFile');
    const $uploadStatus = document.getElementById('uploadStatus');
    const $globalLoader = document.getElementById('globalLoader');
    const $modalOverlay = document.getElementById('modalOverlay');
    const $modalTitle = document.getElementById('modalTitle');
    const $modalContent = document.getElementById('modalContent');
    const $modalClose = document.getElementById('modalClose');

    let lastData = null;

    function onlyDigits(s){ return (s||"").replace(/\D/g, ""); }

    function toggleLoader(isLoading){
      if (isLoading){
        $globalLoader.classList.add('show');
        $globalLoader.setAttribute('aria-hidden', 'false');
      } else {
        $globalLoader.classList.remove('show');
        $globalLoader.setAttribute('aria-hidden', 'true');
      }
    }

    function setStatus(msg, isLoading = false){
      $status.textContent = msg || "";
      $status.setAttribute('aria-busy', isLoading ? 'true' : 'false');
      toggleLoader(!!isLoading);
    }
    function setUploadStatus(msg, isLoading = false){
      $uploadStatus.textContent = msg || "";
      $uploadStatus.setAttribute('aria-busy', isLoading ? 'true' : 'false');
      toggleLoader(!!isLoading);
    }
    function setResumo(html){ $resumo.innerHTML = html || ""; }
    function clearResults(){
      setResumo(""); $addressList.innerHTML = ""; setStatus(""); setUploadStatus("");
      lastData = null;
    }

    // Agrupar endereços por BRR
    function groupAddressesByBRR(features){
      const grouped = {};
      features.forEach(f => {
        const props = f.properties || {};
        const brr = props.BRR || 'Sem endereço';
        if (!grouped[brr]){
          grouped[brr] = [];
        }
        grouped[brr].push(f);
      });
      return grouped;
    }

    // Calcular soma dos DIC e FIC para um grupo
    function calculateIndicators(features){
      const dicSum = Array(12).fill(0);
      const ficSum = Array(12).fill(0);

      features.forEach(f => {
        const props = f.properties || {};
        for(let i = 1; i <= 12; i++){
          const dicKey = `DIC_${String(i).padStart(2, '0')}`;
          const ficKey = `FIC_${String(i).padStart(2, '0')}`;
          dicSum[i-1] += parseFloat(props[dicKey]) || 0;
          ficSum[i-1] += parseFloat(props[ficKey]) || 0;
        }
      });
      
      return { dicSum, ficSum };
    }

    // Construir lista de endereços
    function buildAddressList(features){
      if (!features || !features.length){ 
        $addressList.innerHTML = "<div class='muted'>Nenhum registro.</div>"; 
        return; 
      }

      const grouped = groupAddressesByBRR(features);
      let html = '';

      Object.keys(grouped).sort().forEach(brr => {
        const addressFeatures = grouped[brr];
        const { dicSum, ficSum } = calculateIndicators(addressFeatures);
        
        html += `<div class="address-item" data-brr="${brr}">`;
        html += `<div class="address-header">${brr}</div>`;
        html += `<div class="muted">${addressFeatures.length} unidade(s) consumidora(s)</div>`;
        
        html += `<div class="indicators">`;
        
        // DIC (Duração de Interrupção)
        html += `<div class="indicator">`;
        html += `<div class="indicator-label">DIC (horas):</div>`;
        html += `<div class="indicator-values">`;
        dicSum.forEach((val, idx) => {
          const cssClass = val > 0 ? 'warn' : '';
          html += `<span class="indicator-value ${cssClass}" title="Mês ${idx+1}">${val.toFixed(2)}</span>`;
        });
        html += `</div></div>`;
        
        // FIC (Frequência de Interrupção)
        html += `<div class="indicator">`;
        html += `<div class="indicator-label">FIC (vezes):</div>`;
        html += `<div class="indicator-values">`;
        ficSum.forEach((val, idx) => {
          const cssClass = val > 0 ? 'warn' : '';
          html += `<span class="indicator-value ${cssClass}" title="Mês ${idx+1}">${val.toFixed(0)}</span>`;
        });
        html += `</div></div>`;
        
        html += `</div></div>`;
      });

      $addressList.innerHTML = html;

      // Adicionar eventos de clique
      document.querySelectorAll('.address-item').forEach(item => {
        item.addEventListener('click', () => {
          const brr = item.dataset.brr;
          showModal(grouped[brr]);
        });
      });
    }

    // Mostrar modal com detalhes
    function showModal(features){
      if (!features || !features.length) return;

      const firstProps = features[0].properties || {};
      $modalTitle.textContent = firstProps.BRR || 'Detalhes';

      let html = '';

      features.forEach((f, idx) => {
        const props = f.properties || {};
        
        html += `<div class="modal-section">`;
        html += `<div class="modal-section-title">Unidade ${idx + 1} - ${props.COD_ID ? props.COD_ID.substring(0, 12) + '...' : 'N/A'}</div>`;
        
        // Identificação
        html += `<div class="modal-section-title" style="font-size:12px; margin-top:16px;">Identificação</div>`;
        html += `<div class="modal-grid">`;
        html += createField('Endereço', props.BRR);
        html += createField('CEP', props.CEP);
        html += createField('Ponto de Conexão', props.PN_CON);
        html += createField('Camada', props.__layer);
        const statusBadge = props.SIT_ATIV === 'AT' 
          ? '<span class="status-badge active">ATIVO</span>' 
          : '<span class="status-badge inactive">DESLIGADO</span>';
        html += createField('Situação', statusBadge, true);
        html += createField('Data Conexão', props.DAT_CON);
        html += `</div>`;

        // Classificação
        html += `<div class="modal-section-title" style="font-size:12px; margin-top:16px;">Classificação</div>`;
        html += `<div class="modal-grid">`;
        html += createField('Classe', getClasseDesc(props.CLAS_SUB));
        html += createField('CNAE', props.CNAE);
        html += createField('Tipo', props.TIP_CC);
        html += createField('Grupo Tarifário', props.GRU_TAR);
        html += `</div>`;

        // Dados Técnicos
        html += `<div class="modal-section-title" style="font-size:12px; margin-top:16px;">Dados Técnicos</div>`;
        html += `<div class="modal-grid">`;
        html += createField('Carga Instalada', props.CAR_INST ? `${props.CAR_INST} kW` : 'N/A');
        html += createField('Tensão', props.TEN_FORN ? `${props.TEN_FORN} kV` : 'N/A');
        html += createField('Grupo Tensão', props.GRU_TEN);
        html += createField('Fases', props.FAS_CON);
        html += createField('Transformador', props.UNI_TR_MT);
        html += createField('Circuito', props.CTMT);
        html += createField('Subestação', props.SUB);
        html += createField('Ramal', props.RAMAL);
        html += `</div>`;

        // Consumo Mensal (ENE)
        html += `<div class="modal-section-title" style="font-size:12px; margin-top:16px;">Consumo de Energia (kWh)</div>`;
        html += buildChart('ENE', props, 'Consumo (kWh)');

        // DIC
        html += `<div class="modal-section-title" style="font-size:12px; margin-top:16px;">DIC - Duração de Interrupção (horas)</div>`;
        html += buildChart('DIC', props, 'Horas', true);

        // FIC
        html += `<div class="modal-section-title" style="font-size:12px; margin-top:16px;">FIC - Frequência de Interrupção (vezes)</div>`;
        html += buildChart('FIC', props, 'Vezes', true);

        html += `</div>`;
      });

      $modalContent.innerHTML = html;
      $modalOverlay.classList.add('show');
    }

    function createField(label, value, isHtml = false){
      const displayValue = value || 'N/A';
      return `
        <div class="modal-field">
          <div class="modal-field-label">${label}</div>
          <div class="modal-field-value">${isHtml ? displayValue : escapeHtml(String(displayValue))}</div>
        </div>
      `;
    }

    function getClasseDesc(clas){
      const map = {
        'RE1': 'Residencial',
        'CO1': 'Comercial Baixa',
        'CO3': 'Comercial Média',
        'CO9': 'Comercial Outras',
        'IN': 'Industrial',
        'PP1': 'Serviço Público',
        'PP2': 'Poder Público'
      };
      return map[clas] || clas || 'N/A';
    }

    function buildChart(prefix, props, label, isWarning = false){
      const values = [];
      let max = 0;
      
      for(let i = 1; i <= 12; i++){
        const key = `${prefix}_${String(i).padStart(2, '0')}`;
        const val = parseFloat(props[key]) || 0;
        values.push(val);
        if (val > max) max = val;
      }

      if (max === 0) max = 1; // Evita divisão por zero

      let html = '<div class="chart-container">';
      html += '<div class="chart-bars">';
      
      values.forEach((val, idx) => {
        const height = (val / max) * 100;
        const cssClass = (isWarning && val > 0) ? 'warning' : '';
        html += `<div style="height:${height}%" class="chart-bar ${cssClass}" title="${label}: ${val}"></div>`;
      });
      
      html += '</div>';
      html += '<div style="display:flex; gap:4px; margin-top:4px;">';
      for(let i = 1; i <= 12; i++){
        html += `<div style="flex:1;" class="chart-label">M${i}</div>`;
      }
      html += '</div>';
      html += '</div>';
      
      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function closeModal(){
      $modalOverlay.classList.remove('show');
    }

    async function buscar(){
      const cep = $cep.value.trim();
      const norm = onlyDigits(cep);
      if (norm.length !== 8){
        setStatus("CEP inválido. Use 8 dígitos."); return;
      }
      clearResults();
      setStatus("Consultando API...", true);

      let hasError = false;

      try {
        const url = `${API_BASE}/search?cep=${encodeURIComponent(cep)}`;
        const resp = await fetch(url);
        if (!resp.ok){
          const err = await resp.json().catch(()=>({detail: resp.statusText}));
          throw new Error(err.detail || `Erro HTTP ${resp.status}`);
        }
        const data = await resp.json();
        lastData = data;
        setResumo(`<div>Total: <b>${data.count || 0}</b> unidade(s) consumidora(s)</div>`);

        buildAddressList(data.features || []);
      } catch (e){
        console.error(e);
        hasError = true;
        setStatus("Falha na consulta: " + e.message, false);
      } finally {
        if (hasError){
          setStatus($status.textContent, false);
        } else {
          setStatus("Pronto.", false);
        }
      }
    }

    function uploadGeojsonFile(){
      const file = $fileInput.files[0];
      if (!file){
        setUploadStatus("Selecione um arquivo primeiro.");
        return;
      }

      clearResults();
      setUploadStatus("Carregando arquivo...", true);

      const reader = new FileReader();

      reader.onload = function(e){
        try {
          const data = JSON.parse(e.target.result);
          lastData = data;

          setUploadStatus("✅ Carregado com sucesso!", false);
          setResumo(`<div>Arquivo: <b>${file.name}</b></div><div>Total: <b>${data.features?.length || 0}</b> unidade(s) consumidora(s)</div>`);

          buildAddressList(data.features || []);
        } catch (err){
          console.error(err);
          setUploadStatus("❌ Erro ao processar arquivo: " + err.message, false);
        }
      };

      reader.onerror = function(){
        setUploadStatus("❌ Erro ao ler arquivo.", false);
      };

      reader.readAsText(file);
    }

    function baixarJSON(){
      if (!lastData){ return; }
      const blob = new Blob([JSON.stringify(lastData, null, 2)], {type: "application/json"});
      const a = document.createElement("a");
      const filename = lastData.name || `resultado_${Date.now()}.json`;
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Event Listeners
    $btnBuscar.addEventListener('click', buscar);
    $btnLimpar.addEventListener('click', () => { $cep.value = ""; clearResults(); });
    $btnDownload.addEventListener('click', baixarJSON);
    $cep.addEventListener('keydown', (e) => { if (e.key === "Enter") buscar(); });
    $btnUploadFile.addEventListener('click', uploadGeojsonFile);
    $fileInput.addEventListener('change', uploadGeojsonFile); // Auto-carrega ao selecionar
    $modalClose.addEventListener('click', closeModal);
    $modalOverlay.addEventListener('click', (e) => {
      if (e.target === $modalOverlay) closeModal();
    });
  </script>
</body>
</html>
